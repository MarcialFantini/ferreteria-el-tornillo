<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="t-placa-yeso-estandar-120">
  <title id="t-placa-yeso-estandar-120">Placa de yeso estándar 1.20 x 2.40m</title>
  <rect width="800" height="800" fill="#ebe6d8"/>
  <rect x="0" y="0" width="800" height="800" fill="none" stroke="#d8d2c2" stroke-width="2"/>
  <!-- corner crosshair marks (pliego técnico feel) -->
  <g stroke="#d8d2c2" stroke-width="2" fill="none">
    <path d="M 20 60 L 60 60 M 60 20 L 60 60"/>
    <path d="M 780 60 L 740 60 M 740 20 L 740 60"/>
    <path d="M 20 740 L 60 740 M 60 780 L 60 740"/>
    <path d="M 780 740 L 740 740 M 740 780 L 740 740"/>
  </g>
  
    <g transform="translate(0,0)">
      <rect x="80" y="120" width="640" height="400" fill="#f5f2ea" stroke="#171513" stroke-width="6"/>
      <rect x="80" y="120" width="640" height="40" fill="#5d544a"/>
      <text x="400" y="280" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="36" font-weight="800" fill="#171513">YESO</text>
      <text x="400" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" fill="#171513">1.20 × 2.40 m</text>
      <text x="400" y="380" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" fill="#c28e3f">12.5 mm espesor</text>
      <circle cx="160" cy="450" r="20" fill="#c28e3f"/>
      <circle cx="400" cy="450" r="20" fill="#c28e3f"/>
      <circle cx="640" cy="450" r="20" fill="#c28e3f"/>
    </g>
</svg>
